name: Lockfile check

on:
  pull_request:
    paths:
      - "package.json"
      - "*/package.json"
      - "*/*/package.json"
      - "pnpm-lock.yaml"
      - ".npmrc"
      - "pnpm-workspace.yaml"
      - ".github/workflows/lockfile-check.yml"

jobs:
  frozen-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install with frozen lockfile
        run: pnpm install --frozen-lockfile
